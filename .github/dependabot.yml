version: 2
updates:
  # Python packages are pinned together in constraints.txt (e.g. pydantic + pydantic-core, psycopg +
  # psycopg-binary must move in lockstep), so updates are grouped into one PR that CI can actually install.
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
