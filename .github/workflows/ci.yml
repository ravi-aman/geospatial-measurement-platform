name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: geomeasure
          POSTGRES_PASSWORD: geomeasure
          POSTGRES_DB: geomeasure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geomeasure" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geomeasure:geomeasure@localhost:5432/geomeasure
      REQUIRE_DB_TESTS: "1"   # fail (not skip) if the database tests cannot run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install (pinned to tested versions)
        run: uv pip install --system -c constraints.txt -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests migrations scripts
          ruff format --check app tests migrations scripts
      - name: Type check
        run: mypy app
      - name: Tests (unit, integration, API) with coverage
        run: pytest -m "not slow" --cov --cov-report=term --cov-report=xml
      - name: Performance tests
        run: pytest -m slow -s
      - name: Migrations apply on a clean database
        env:
          DATABASE_URL: postgresql+psycopg://geomeasure:geomeasure@localhost:5432/geomeasure
        run: alembic upgrade head
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: geomeasure-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: geomeasure-web:ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: surfaces advisories without blocking unrelated changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip-audit -r <(grep -v '^#' backend/constraints.txt | grep -v '^$')
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: cd frontend && npm audit --omit=dev --audit-level=high
