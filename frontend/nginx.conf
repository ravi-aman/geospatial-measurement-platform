# Keep the client's X-Request-ID when it sends one; otherwise use nginx's own id.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are validated by the API (which enforces its own limit); keep the proxy limit slightly above it.
    client_max_body_size 110m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_read_timeout 60s;
        proxy_request_buffering off;  # stream uploads to the API instead of buffering them here
    }

    location ~ ^/(health|ready|docs|redoc|openapi.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Fingerprinted build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
